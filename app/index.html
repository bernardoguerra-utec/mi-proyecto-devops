<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline DevOps</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    main {
      max-width: 700px;
      margin: 24px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    h1 {
      color: #0b5cab;
    }

    .ok {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      color: white;
      background: #198754;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Pipeline DevOps funcionando!</h1>
    <p>Aplicación construida con Docker y desplegada automáticamente desde Jenkins.</p>
    <p class="ok">Despliegue exitoso</p>
  </main>
</body>
</html>
